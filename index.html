<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>航空气象</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-alt: #f1f5f9;
  --text: #0f172a;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --accent: #2563eb;
  --accent-light: #eff6ff;
  --green: #16a34a;
  --green-bg: #f0fdf4;
  --yellow: #ca8a04;
  --yellow-bg: #fefce8;
  --red: #dc2626;
  --red-bg: #fef2f2;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
  --shadow: 0 4px 6px -1px rgba(0,0,0,.04), 0 2px 4px -2px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,.05), 0 8px 10px -6px rgba(0,0,0,.04);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #000; color: var(--text); min-height: 100vh;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  transition: background .6s;
}
#space-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#space-bg canvas { display: block; }
.container { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; position: relative; z-index: 1; }

/* Header */
.header { text-align: center; padding: 40px 0 32px; }
.header .logo { font-size: 36px; margin-bottom: 8px; }
.header h1 { font-size: 28px; font-weight: 700; letter-spacing: -.5px; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.3); }
.header .sub { font-size: 14px; color: rgba(255,255,255,.75); margin-top: 4px; }

/* Selectors */
.selector-area { display: flex; gap: 12px; margin: 20px auto; flex-wrap: wrap; justify-content: center; max-width: 560px; }
.selector { flex: 1; min-width: 200px; position: relative; }
.selector label { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.7); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; text-align: center; }
.select-input { width: 100%; padding: 12px 16px; border: 1.5px solid rgba(255,255,255,.2); border-radius: var(--radius-sm); font-size: 15px; background: rgba(255,255,255,.12); backdrop-filter: blur(8px); color: #fff; outline: none; transition: .15s; font-family: inherit; text-align: center; }
.select-input:focus { border-color: rgba(255,255,255,.5); box-shadow: 0 0 0 3px rgba(255,255,255,.1); }
.select-input::placeholder { color: rgba(255,255,255,.4); }
.dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm); margin-top: 4px; max-height: 240px; overflow-y: auto; z-index: 100; box-shadow: var(--shadow-lg); }
.dropdown.show { display: block; }
.dropdown-item { padding: 10px 16px; cursor: pointer; font-size: 14px; border-bottom: 1px solid var(--border); transition: .1s; }
.dropdown-item:last-child { border-bottom: none; }
.dropdown-item:hover { background: var(--accent-light); }
.dropdown-item .info { font-size: 12px; color: var(--text-muted); margin-left: 6px; }
.no-match { padding: 14px 16px; color: var(--text-muted); font-size: 13px; text-align: center; }

/* Button */
.btn-area { text-align: center; margin: 24px 0; }
.btn-query { padding: 13px 48px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; transition: .15s; font-family: inherit; box-shadow: var(--shadow); }
.btn-query:hover { opacity: .92; transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.btn-query:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-query .spinner { display: none; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; margin-right: 8px; vertical-align: middle; }
.btn-query.loading .spinner { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Results */
.results { display: none; }
.results.show { display: block; }
.card { background: rgba(255,255,255,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.3); }
.card h2 { font-size: 17px; font-weight: 600; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; justify-content: center; color: var(--text); }
.card h3 { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 18px 0 10px; text-transform: uppercase; letter-spacing: .5px; text-align: center; }

/* Status */
.status-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
.status-green { background: var(--green); }
.status-yellow { background: var(--yellow); }
.status-red { background: var(--red); }

/* Tables */
.links-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.links-table th, .links-table td { padding: 10px 8px; text-align: center; }
.links-table th { color: var(--text-muted); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--border); }
.links-table td { border-bottom: 1px solid var(--border); }
.links-table a { color: var(--accent); text-decoration: none; font-weight: 500; }
.links-table a:hover { text-decoration: underline; }

/* Code */
.code-block { background: #1e293b; color: #e2e8f0; padding: 16px; border-radius: var(--radius-sm); font-family: 'SF Mono','Fira Code','Consolas',monospace; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin: 8px 0; line-height: 1.7; }

/* Analysis table */
.analysis-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.analysis-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
.analysis-table td:first-child { color: var(--text-secondary); font-weight: 500; white-space: nowrap; width: 100px; font-size: 13px; }
.analysis-table .danger { font-weight: 600; color: var(--red); }

/* TAF */
.taf-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.taf-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
.taf-table td:first-child { color: var(--text-secondary); font-weight: 500; white-space: nowrap; width: 100px; font-size: 13px; }

/* Tempo */
.tempo-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.tempo-table th { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.tempo-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); }

/* Alerts */
.alert { padding: 14px 18px; border-radius: var(--radius-sm); margin: 10px 0; font-size: 13px; line-height: 1.8; }
.alert-danger { background: var(--red-bg); border: 1px solid #fecaca; color: #991b1b; }
.alert-success { background: var(--green-bg); border: 1px solid #bbf7d0; color: #166534; }
.alert ul { margin: 0; padding-left: 20px; }

/* Windy */
.windy-row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.windy-frame { flex: 1; min-width: 280px; height: 350px; border: 1px solid var(--border); border-radius: var(--radius-sm); }

/* Summary */
.summary-card { text-align: center; padding: 20px; }
.summary-card .airport-summary { font-size: 15px; margin: 6px 0; }

/* Error */
.error-msg { padding: 14px 18px; background: var(--red-bg); border: 1px solid #fecaca; border-radius: var(--radius-sm); color: #991b1b; font-size: 13px; }

/* Responsive */
@media (max-width: 600px) {
  .container { padding: 16px 12px 40px; }
  .header { padding: 24px 0 20px; }
  .header h1 { font-size: 24px; }
  .card { padding: 16px; }
  .code-block { font-size: 10px; padding: 12px; }
  .windy-frame { min-width: 100%; height: 280px; }
  .btn-query { padding: 12px 36px; }
}
</style>
</head>

  {name:'首尔',icao:'RKSI',lat:37.46,lon:126.44,nmc:null,airport:'仁川',intl:true},

const NMC_NAMES = {
  huabei:'华北',huadong:'华东',huanan:'华南',huazhong:'华中',
  xinan:'西南',xibei:'西北',dongbei:'东北'
};

// ============================================================
// ADVERSE WEATHER ANALYSIS (loaded from data/adverse-weather.js)
// ============================================================
const WEATHER_SECTIONS = {
  TS: { kw: ['TS','TSRA','-TSRA','+TSRA','RETS','CB','SHRA','-SHRA','+SHRA','RA','-RA','+RA','DZ','-DZ','+DZ','SN','-SN','+SN','SG','GS','PL','GR','SQ','VCTS','VCSH'], title: '雷暴/降水', section: '二、雷暴', endSection: /^三、/m },
  TURB: { kw: ['TURB'], title: '颠簸', section: '三、', endSection: /^四、/m },
  WS: { kw: ['WS','WIND SHEAR'], title: '风切变', section: '四、', endSection: /^五、/m },
  FG: { kw: ['BR','FG','MIFG','BCFG','PRFG','HZ','FU','DU','SA','VA'], title: '低能见度', section: '五、', endSection: /^六、/m },
  ICE: { kw: ['ICE','FZDZ','FZRA','FZFG','BLSN','BLSA','BLDU'], title: '结冰/寒冷天气', section: '六、', endSection: /^七、/m },
};
const dangerKeywords = ['+TSRA','+SHRA','GR','SQ'];

function getWeatherDoc() {
  let doc = window.ADVERSE_WEATHER || '';
  // Normalize \r\n to \n for section marker matching
  return doc.replace(/\r\n/g, '\n');
}

function extractSection(doc, startMarker, endRegex) {
  const start = doc.indexOf(startMarker);
  if (start === -1) return '';
  const rest = doc.substring(start);
  const endMatch = rest.match(endRegex);
  if (endMatch) return rest.substring(0, endMatch.index);
  return rest;
}

function detectWeather(raw) {
  if (!raw) return [];
  const upper = raw.toUpperCase();
  const hits = [];
  const seen = new Set();
  for (const [key, cfg] of Object.entries(WEATHER_SECTIONS)) {
    const matched = cfg.kw.some(kw => {
      const re = new RegExp('(^|\\s)' + kw.replace(/[+#-]/g, '\\$&') + '(\\s|$)', 'i');
      return re.test(upper);
    });
    if (matched && !seen.has(key)) {
      seen.add(key);
      const doc = getWeatherDoc();
      const content = extractSection(doc, cfg.section, cfg.endSection);
      hits.push({ name: cfg.title, content: content || '（文档未加载，请稍后重试）' });
    }
  }
  return hits;
}

// ============================================================
// APP STATE
// ============================================================
let selected1 = null;

// ============================================================
// UI FUNCTIONS
// ============================================================
function findCity(q) {
  const qq = q.toUpperCase().trim();
  if (!qq) return [];
  return CITIES.filter(c =>
    c.icao.includes(qq) || c.name.includes(q) ||
    c.airport.includes(q) || (c.name+' '+c.airport).includes(q)
  ).slice(0, 8);
}

function filterCities(n) {
  const input = document.getElementById('input'+n);
  const dropdown = document.getElementById('dropdown'+n);
  const matches = findCity(input.value);
  if (matches.length === 0) {
    dropdown.innerHTML = '<div class="no-match">未找到匹配机场</div>';
  } else {
    dropdown.innerHTML = matches.map(c =>
      `<div class="dropdown-item" onclick="selectCity(${n},'${c.icao}')">
        <span class="city">${c.name} ${c.icao}</span>
        <span class="info">${c.airport}${c.noMetar?' ⚠无METAR':''}${c.intl?' 🌐':''}</span>
      </div>`
    ).join('');
  }
  dropdown.classList.add('show');
}

function showDropdown(n) {
  const input = document.getElementById('input'+n);
  if (input.value) filterCities(n);
  else {
    const dropdown = document.getElementById('dropdown'+n);
    dropdown.innerHTML = CITIES.map(c =>
      `<div class="dropdown-item" onclick="selectCity(${n},'${c.icao}')">
        <span class="city">${c.name} ${c.icao}</span>
        <span class="info">${c.airport}${c.noMetar?' ⚠无METAR':''}${c.intl?' 🌐':''}</span>
      </div>`
    ).join('');
    dropdown.classList.add('show');
  }
}

function selectCity(n, icao) {
  const city = CITIES.find(c => c.icao === icao);
  document.getElementById('input'+n).value = city.name + ' ' + city.icao;
  document.getElementById('dropdown'+n).classList.remove('show');
  if (n === 1) selected1 = city;
  else selected2 = city;
}

// Close dropdowns on outside click
document.addEventListener('click',function(e) {
  if (!e.target.closest('.selector')) {
    document.getElementById('dropdown1').classList.remove('show');
    document.getElementById('dropdown2').classList.remove('show');
  }
});

// ============================================================
// API & PARSING
// ============================================================
async function fetchMetar(icao) {
  // Primary: fetch from cached data JS file (no CORS needed, refreshed every 10min via GitHub Actions)
  try {
    if (!window.METAR_DATA) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'data/metar.js?_=' + Date.now();
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    // Ensure adverse weather doc is loaded
    if (!window.ADVERSE_WEATHER) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'data/adverse-weather.js?_=' + Date.now();
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    if (window.METAR_DATA) {
      const lines = window.METAR_DATA.split('\n').filter(l => l.includes(icao) && l.trim());
      if (lines.length > 0) return lines.join('\n');
    }
  } catch(e) {}
  // Fallback: try direct
  const url = 'https://aviationweather.gov/api/data/metar?ids=' + icao + '&taf=true';
  try {
    const resp = await fetch(url);
    if (resp.ok) return await resp.text();
  } catch(e) {}
  // Fallback: CORS proxies
  const proxies = [
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    u => 'https://corsproxy.io/?' + encodeURIComponent(u),
    u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)
  ];
  let lastErr = null;
  for (const make of proxies) {
    try {
      const resp = await fetch(make(url));
      if (resp.ok) return await resp.text();
      lastErr = new Error('HTTP ' + resp.status);
    } catch(e) { lastErr = e; }
  }
  throw lastErr || new Error('所有代理失败');
}

function parseMetar(raw) {
  if (!raw || raw.trim() === '') return null;
  const lines = raw.split('\n').filter(l => l.trim());
  const result = { metar: null, taf: null };
  for (const line of lines) {
    const trimmed = line.trim();
    if (trimmed.startsWith('METAR') || trimmed.match(/^[A-Z]{4}\s\d{6}Z/)) {
      result.metar = trimmed;
    } else if (trimmed.startsWith('TAF')) {
      result.taf = result.taf ? result.taf + ' ' + trimmed : trimmed;
    }
  }
  return result;
}

function extractMetarFields(metar) {
  if (!metar) return null;
  const parts = metar.split(/\s+/);
  const fields = {
    raw: metar,
    icao: parts[0] === 'METAR' ? parts[1] : parts[0],
    time: '',
    wind: '',
    visibility: '',
    weather: '',
    clouds: [],
    tempDew: '',
    qnh: '',
    trend: ''
  };

  let idx = parts[0] === 'METAR' ? 2 : 1;
  // Time
  if (idx < parts.length && /^\d{6}Z$/.test(parts[idx])) {
    fields.time = parts[idx];
    idx++;
  }
  // AUTO
  if (idx < parts.length && parts[idx] === 'AUTO') idx++;
  // Wind
  const windIdx = parts.findIndex((p,i) => i >= idx && /^\d{5}(G\d{2,3})?(MPS|KT|KPH)$/i.test(p));
  if (windIdx >= idx) {
    fields.wind = parts[windIdx];
    // Weather between wind and idx
    const wxParts = [];
    for (let i = idx; i < windIdx; i++) {
      if (parts[i] !== 'AUTO') wxParts.push(parts[i]);
    }
    if (wxParts.length > 0) fields.visibility = wxParts.join(' ');
    idx = windIdx + 1;
  }
  // Visibility
  let visParts = [];
  while (idx < parts.length) {
    const p = parts[idx];
    if (p === 'CAVOK') { visParts.push('CAVOK'); idx++; break; }
    if (/^\d{4}$/.test(p)) { visParts.push(p); idx++; }
    else if (/^\d{4}(N|NE|E|SE|S|SW|W|NW|NNE|ENE|ESE|SSE|SSW|WSW|WNW|NNW)$/.test(p)) {visParts.push(p); idx++; }
    else if (p === '9999') { visParts.push('9999'); idx++; }
    else break;
  }
  if (visParts.length > 0) fields.visibility = visParts.join(' ');
  // Weather phenomena
  const wxPhenomena = ['-TSRA','+TSRA','TSRA','-SHRA','+SHRA','SHRA','-RA','+RA','RA','-DZ','+DZ','DZ','-SN','+SN','SN','-GR','+GR','GR','-SG','SG','-GS','GS','-PL','PL','TS','SQ','BR','FG','FU','HZ','DU','SA','VA','DS','SS','PO','FC','MIFG','BCFG','PRFG','FZDZ','FZRA','FZFG','BLSN','BLSA','BLDU','DRSN','DRSA','DRDU','VCTS','VCSH','VCBLSN'];
  const wxIdx = parts.findIndex((p,i) => i >= idx && wxPhenomena.includes(p));
  if (wxIdx >= idx) {
    fields.weather = parts[wxIdx];
    idx = wxIdx + 1;
  }
  // Clouds
  const cloudTypes = ['FEW','SCT','BKN','OVC','NSC','NCD','VV','TCU','CB'];
  while (idx < parts.length) {
    const cloudMatch = cloudTypes.some(ct => parts[idx].startsWith(ct));
    if (!cloudMatch) break;
    fields.clouds.push(parts[idx]);
    idx++;
  }
  // Temp/Dew
  if (idx < parts.length && /^M?\d{2}\/M?\d{2}$/.test(parts[idx])) {
    fields.tempDew = parts[idx];
    idx++;
  }
  // QNH
  if (idx < parts.length && /^Q\d{4}$/.test(parts[idx])) {
    fields.qnh = parts[idx];
    idx++;
  }
  // Trend (NOSIG, BECMG, TEMPO)
  const trendParts = [];
  while (idx < parts.length) {
    trendParts.push(parts[idx]);
    idx++;
  }
  fields.trend = trendParts.join(' ');
  if (fields.trend === 'NOSIG' || fields.trend.includes('NOSIG')) fields.trend = 'NOSIG';

  return fields;
}

function formatWind(part) {
  if (!part) return 'N/A';
  const m = part.match(/^(\d{3})(\d{2,3})(G(\d{2,3}))?(MPS|KT|KPH)$/i);
  if (!m) return part;
  const dir = m[1], speed = m[2], gust = m[4], unit = m[5].toUpperCase();
  const dirNames = {'N':'北','NE':'东北','E':'东','SE':'东南','S':'南','SW':'西南','W':'西','NW':'西北'};
  function dirTo(d) {
    const idx = Math.round(parseInt(d) / 45) % 8;
    return ['北','东北','东','东南','南','西南','西','西北'][idx];
  }
  let s = dir + '° ' + dirTo(dir) + '风 ' + speed + (unit === 'MPS' ? 'm/s' : 'kt');
  if (unit === 'MPS') s += '（约' + Math.round(parseInt(speed)*2) + 'kt）';
  if (gust) {
    s += ' 阵风' + gust + (unit === 'MPS' ? 'm/s' : 'kt');
    if (unit === 'MPS') s += '（约' + Math.round(parseInt(gust)*2) + 'kt）';
  }
  return s;
}

function formatVis(part) {
  if (!part) return 'N/A';
  if (part.includes('CAVOK')) return 'CAVOK（≥10km）';
  const m = part.match(/^(\d{4})/);
  if (m) {
    const v = parseInt(m[1]);
    if (v === 9999) return '≥10km';
    return (v/1000).toFixed(1) + 'km';
  }
  return part;
}

function formatClouds(clouds) {
  if (!clouds || clouds.length === 0) return 'N/A';
  return clouds.map(c => {
    const type = c.substring(0,3);
    const alt = c.substring(3);
    const names = {FEW:'少云',SCT:'疏云',BKN:'多云',OVC:'满天云',NSC:'无重要云',NCD:'无云',VV:'垂直能见度'};
    const suffix = alt ? ' ' + parseInt(alt)*100 + 'ft' : '';
    return (names[type] || type) + suffix;
  }).join(', ');
}

function parseTaf(raw) {
  if (!raw) return null;
  // Remove "TAF " prefix and ICAO part
  let taf = raw.replace(/^TAF\s+/, '');
  // Extract issuance time: first 6 digits + Z
  const issueMatch = taf.match(/^[A-Z]{4}\s(\d{6}Z)/);
  const issueTime = issueMatch ? issueMatch[1] : '';
  // Extract validity: next 8 digits
  const validMatch = taf.match(/(\d{4})\/(\d{4})/);
  const validFrom = validMatch ? validMatch[1] : '';
  const validTo = validMatch ? validMatch[2] : '';

  // Main body - everything between validity and first BECMG/TEMPO/PROB or TX/TN
  const mainMatch = taf.match(/\/\d{4}\s+(.+?)(?=\s*(?:BECMG|TEMPO|PROB\d{2}|TX\d{2}\/|$))/);
  const mainBody = mainMatch ? mainMatch[1].trim() : '';

  // TEMPO/BECMG groups
  const groups = [];
  const groupRegex = /(BECMG|TEMPO)\s+(\d{4}\/\d{4})\s+(.+?)(?=\s*(?:BECMG|TEMPO|PROB\d{2}|TX\d{2}\/|TN\d{2}\/|$))/g;
  let gm;
  while ((gm = groupRegex.exec(taf)) !== null) {
    groups.push({type: gm[1], period: gm[2], weather: gm[3].trim()});
  }

  // TX/TN
  const txMatch = taf.match(/TX(\d{2})\/(\d{4}Z)/);
  const tnMatch = taf.match(/TN(\d{2})\/(\d{4}Z)/);
  const tx = txMatch ? txMatch[1] + '°C' : '';
  const tn = tnMatch ? tnMatch[1] + '°C' : '';

  return { raw, issueTime, validFrom, validTo, mainBody, groups, tx, tn };
}

function utcToBeijing(utc) {
  // utc format: DDHHMMZ or DDZ
  if (!utc) return '';
  if (/^\d{2}\/\d{4}Z$/.test(utc)) {
    const d = parseInt(utc.substring(0,2));
    const h = parseInt(utc.substring(3,5));
    const m = parseInt(utc.substring(5,7));
    const date = new Date(Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), d, h, m));
    date.setHours(date.getHours() + 8);
    return date.getDate() + '日 ' + String(date.getHours()).padStart(2,'0') + ':' + String(date.getMinutes()).padStart(2,'0');
  }
  if (/^\d{6}Z$/.test(utc)) {
    const d = parseInt(utc.substring(0,2));
    const h = parseInt(utc.substring(2,4));
    const m = parseInt(utc.substring(4,6));
    const date = new Date(Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), d, h, m));
    date.setHours(date.getHours() + 8);
    return date.getDate() + '日 ' + String(date.getHours()).padStart(2,'0') + ':' + String(date.getMinutes()).padStart(2,'0') + ' 北京时';
  }
  if (/^\d{4}$/.test(utc)) {
    const d = parseInt(utc.substring(0,2));
    const h = parseInt(utc.substring(2,4));
    const date = new Date(Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), d, h));
    date.setHours(date.getHours() + 8);
    return date.getDate() + '日 ' + String(date.getHours()).padStart(2,'0') + ' 时';
  }
  if (/^\d{4}\/\d{4}$/.test(utc)) {
    const from = utc.substring(0,4);
    const to = utc.substring(5,9);
    const fd = parseInt(from.substring(0,2)), fh = parseInt(from.substring(2,4));
    const td = parseInt(to.substring(0,2)), th = parseInt(to.substring(2,4));
    const fDate = new Date(Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), fd, fh));
    const tDate = new Date(Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), td, th));
    fDate.setHours(fDate.getHours() + 8);
    tDate.setHours(tDate.getHours() + 8);
    return fDate.getDate() + '日 ' + String(fDate.getHours()).padStart(2,'0') + ':00 – ' +
           tDate.getDate() + '日 ' + String(tDate.getHours()).padStart(2,'0') + ':00 北京时';
  }
  return utc;
}

function windyUrl(lat, lon, overlay) {
  return 'https://embed.windy.com/embed2.html?lat=' + lat + '&lon=' + lon +
    '&zoom=8&overlay=' + overlay + '&menu=&metricWind=kt&metricTemp=%C2%B0C';
}

function nmcUrl(region) {
  if (!region) return null;
  return 'https://www.nmc.cn/publish/radar/' + region + '.html';
}

function statusDot(level) {
  if (level === 'danger') return '<span class="status-dot status-red"></span>';
  if (level === 'caution') return '<span class="status-dot status-yellow"></span>';
  return '<span class="status-dot status-green"></span>';
}

// ============================================================
// RENDER
// ============================================================
function renderAirportSection(city, metarFields, tafData, weatherHits, isDual) {
  const isDangerHit = (h) => dangerKeywords.some(k => h.name.includes(k));
  const level = weatherHits.length > 0 ? (weatherHits.some(isDangerHit) ? 'danger' : 'caution') : 'good';
  const dot = statusDot(level);
  const nmc = nmcUrl(city.nmc);
  const hasMetar = !city.noMetar;

  let html = '<div class="card">';
  html += '<h2>' + dot + ' ' + city.name + ' ' + city.icao + ' · ' + city.airport + '</h2>';

  // Radar
  html += '<h3>🌊 气象雷达</h3>';
  html += '<table class="links-table"><tr><th>NMC 雷达</th><th>Windy 雷达</th></tr><tr>';
  if (nmc) html += '<td><a href="' + nmc + '" target="_blank">' + (NMC_NAMES[city.nmc]||city.nmc) + '雷达拼图</a></td>';
  else html += '<td>N/A（境外）</td>';
  html += '<td><a href="' + windyUrl(city.lat, city.lon, 'radar') + '" target="_blank">Windy 雷达</a></td>';
  html += '</tr></table>';

  // Windy radar iframe
  if (!isDual) {
    html += '<iframe class="windy-frame" src="' + windyUrl(city.lat, city.lon, 'radar') + '" loading="lazy" style="width:100%;height:350px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-top:10px;"></iframe>';
  }

  // METAR
  if (!hasMetar) {
    html += '<h3>⚠️ METAR/TAF 不可用</h3>';
    html += '<div class="alert alert-danger">' + city.name + city.airport + '为支线机场，不在 aviationweather.gov 覆盖范围。请参考上方 Windy 雷达与风场进行天气评估。</div>';
  } else if (!metarFields) {
    html += '<h3>⚠️ 暂无报文数据</h3>';
    html += '<div class="alert alert-danger">未能获取 ' + city.icao + ' 的 METAR/TAF 数据，请稍后重试。</div>';
  } else {
    // METAR
    html += '<h3>📡 METAR 报</h3>';
    html += '<div class="code-block">' + metarFields.raw + '</div>';

    // Parsed analysis
    html += '<table class="analysis-table">';
    html += '<tr><td>时间</td><td>' + utcToBeijing(metarFields.time) + '</td></tr>';
    html += '<tr><td>风</td><td>' + formatWind(metarFields.wind) + '</td></tr>';
    html += '<tr><td>能见度</td><td>' + formatVis(metarFields.visibility) + '</td></tr>';
    if (metarFields.weather) {
      const isDanger = /TSRA|TS|\+TSRA|\+SHRA|GR|SQ|CB/i.test(metarFields.weather);
      html += '<tr><td>天气现象</td><td' + (isDanger?' class="danger"':'') + '>' + metarFields.weather + '</td></tr>';
    }
    html += '<tr><td>云</td><td>' + formatClouds(metarFields.clouds) + '</td></tr>';
    html += '<tr><td>温度/露点</td><td>' + (metarFields.tempDew || 'N/A') + '</td></tr>';
    html += '<tr><td>QNH</td><td>' + (metarFields.qnh ? metarFields.qnh.substring(1) + ' hPa' : 'N/A') + '</td></tr>';
    html += '<tr><td>趋势</td><td>' + (metarFields.trend || 'N/A') + '</td></tr>';
    html += '</table>';

    // TAF
    if (tafData) {
      html += '<h3>📋 TAF 报</h3>';
      html += '<div class="code-block">' + tafData.raw + '</div>';

      html += '<table class="taf-table">';
      html += '<tr><td>有效时段</td><td>' + utcToBeijing(tafData.validFrom + '/' + tafData.validTo) + '</td></tr>';
      if (tafData.mainBody) html += '<tr><td>主体</td><td>' + tafData.mainBody + '</td></tr>';
      if (tafData.tx || tafData.tn) {
        html += '<tr><td>温度</td><td>';
        if (tafData.tx) html += '最高 ' + tafData.tx + ' ';
        if (tafData.tn) html += '最低 ' + tafData.tn;
        html += '</td></tr>';
      }
      html += '</table>';

      // TEMPO/BECMG
      if (tafData.groups.length > 0) {
        html += '<h3>⚠️ TEMPO / BECMG（北京时）</h3>';
        html += '<table class="tempo-table"><tr><th>类型</th><th>时段（北京时）</th><th>天气</th></tr>';
        for (const g of tafData.groups) {
          const isDanger = /TSRA|TS|\+TSRA|CB|GR|SQ/i.test(g.weather);
          html += '<tr>';
          html += '<td>' + (isDanger ? '🔴 ' : '') + g.type + '</td>';
          html += '<td>' + utcToBeijing(g.period) + '</td>';
          html += '<td' + (isDanger?' class="danger"':'') + '>' + g.weather + '</td>';
          html += '</tr>';
        }
        html += '</table>';
      } else {
        html += '<h3>⚠️ TEMPO / BECMG（北京时）</h3>';
        html += '<table class="tempo-table"><tr><th>时段</th><th>天气</th></tr><tr><td colspan="2">—</td></tr></table>';
      }
    }
  }

  html += '</div>';
  return { html, level, weatherHits };
}

function render() {
  const btn = document.getElementById('btn-query');
  btn.classList.remove('loading');
  btn.disabled = false;

  const results = document.getElementById('results');

  let html = '';

  // Render airport 1
  const r1 = airportResults[0];
  if (r1) {
    const rendered = renderAirportSection(r1.city, r1.metarFields, r1.tafData, r1.weatherHits);
    html += rendered.html;
  }

  // Adverse weather analysis
  const allHits = [];
  const allCities = [];
  for (const r of airportResults) {
    if (r) {
      allCities.push(r.city);
      for (const h of r.weatherHits) {
        if (!allHits.find(x => x.name === h.name)) allHits.push(h);
      }
    }
  }

  // Summary + Adverse Weather Analysis combined
  html += '<div class="card"><h2>总结</h2>';
  for (let i = 0; i < airportResults.length; i++) {
    const r = airportResults[i];
    if (!r) continue;
    const hasMetar = !r.city.noMetar;
    let status = '🟢', desc = '天气晴好';
    if (!hasMetar && r.city.noMetar) {
      status = '🟡'; desc = '支线机场，METAR 不可用，请参考 Windy';
    } else if (r.weatherHits.length > 0) {
      const isDanger = r.weatherHits.some(h => dangerKeywords.some(k => h.name.includes(k)));
      status = isDanger ? '🔴' : '🟡';
      desc = r.weatherHits.map(h => h.name).join('、');
    }
    html += '<p style="font-size:16px;font-weight:600;margin:8px 0;">' + status + ' ' + r.city.name + ' ' + r.city.icao + '：' + desc + '</p>';
  }

  // Embed adverse weather document analysis in summary
  if (allHits.length > 0) {
    html += '<h3 style="margin-top:16px;color:var(--red);text-transform:none;text-align:left;">⚠️ 不利天气分析</h3>';
    for (const hit of allHits) {
      html += '<h3 style="color:var(--red);text-transform:none;text-align:left;">' + hit.name + '</h3>';
      html += '<div class="alert alert-danger" style="white-space:pre-wrap;font-size:12px;line-height:1.8;">' + hit.content.replace(/\r\n/g,'\n').replace(/\n/g,'<br>') + '</div>';
    }
  }
  html += '</div>';

  results.innerHTML = html;
  results.classList.add('show');
  results.scrollIntoView({behavior:'smooth'});
}

// ============================================================
// MAIN QUERY
// ============================================================
let airportResults = [];

async function query() {
  const btn = document.getElementById('btn-query');
  if (btn.disabled) return;

  if (!selected1) {
    alert('请先选择机场');
    return;
  }

  const cities = [selected1];

  const icaoCodes = cities.map(c => c.icao).join(',');

  try {
    let raw = '';
    try {
      raw = await fetchMetar(icaoCodes);
    } catch(e) {
      document.getElementById('results').innerHTML = '<div class="card"><div class="error-msg">获取气象数据失败：' + e.message + '。请检查网络后重试。</div></div>';
      document.getElementById('results').classList.add('show');
      btn.classList.remove('loading');
      btn.disabled = false;
      return;
    }

    // Split by airport
    const blocks = raw.split(/\n/)
      .filter(l => l.trim())
      .join('\n')
      .split(/(?=METAR|TAF)/i)
      .filter(b => b.trim());

    for (let i = 0; i < cities.length; i++) {
      const city = cities[i];
      const icao = city.icao;

      // Find all matching blocks for this ICAO and join
      const block = blocks.filter(b => b.includes(icao)).join(' ');

      const parsed = parseMetar(block);
      const metarFields = parsed && parsed.metar ? extractMetarFields(parsed.metar) : null;
      const tafData = parsed && parsed.taf ? parseTaf(parsed.taf) : null;

      const allRaw = (parsed ? (parsed.metar||'') + ' ' + (parsed.taf||'') : block);
      const weatherHits = detectWeather(allRaw);

      airportResults.push({ city, metarFields, tafData, weatherHits });
    }

    render();
  } catch(e) {
    document.getElementById('results').innerHTML = '<div class="card"><div class="error-msg">处理数据时出错：' + e.message + '</div></div>';
    document.getElementById('results').classList.add('show');
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

// Initialize
// Initialize
// ============================================================
// SPACE BACKGROUND - stars + real-time Earth from space
// ============================================================
(function(){
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  const stars = [];
  let earthImg = null;
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    initStars();
  }

  function initStars() {
    stars.length = 0;
    const count = Math.floor(w * h / 800);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * w, y: Math.random() * h,
        r: Math.random() * 1.2 + .3,
        a: Math.random(), speed: Math.random() * .01 + .003
      });
    }
  }

  function drawStars(alpha) {
    for (const s of stars) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + (s.a * alpha) + ')';
      ctx.fill();
      s.a += s.speed;
      if (s.a > 1 || s.a < .2) s.speed *= -1;
    }
  }

  // Time-based background tint
  function getTimeTint() {
    const hh = new Date().getHours();
    // Night (22-5): deep dark blue
    if (hh >= 22 || hh < 5) return 'rgba(5,10,30,.75)';
    // Dawn (5-7): purple-orange
    if (hh >= 5 && hh < 7) return 'rgba(40,20,60,.65)';
    // Morning (7-12): light blue
    if (hh >= 7 && hh < 12) return 'rgba(10,30,70,.55)';
    // Afternoon (12-17): bright blue
    if (hh >= 12 && hh < 17) return 'rgba(15,45,100,.5)';
    // Dusk (17-19): orange-purple
    if (hh >= 17 && hh < 19) return 'rgba(50,25,45,.6)';
    // Evening (19-22): dark blue
    return 'rgba(10,15,40,.7)';
  }

  function drawEarth() {
    if (!earthImg) return;
    const size = Math.min(w, h) * 1.6;
    const x = w / 2 - size / 2;
    const y = h / 2 - size / 2;
    ctx.save();
    ctx.globalAlpha = .35;
    ctx.drawImage(earthImg, x, y, size, size);
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, w, h);
    // Time-based tinted background
    ctx.fillStyle = getTimeTint();
    ctx.fillRect(0, 0, w, h);
    // Earth
    drawEarth();
    // Stars
    drawStars(.7);
    requestAnimationFrame(render);
  }

  // Load Himawari-8 latest Earth image
  function loadEarth() {
    const now = new Date();
    // Himawari updates every 10 min, round down to nearest 10
    const min = Math.floor(now.getUTCMinutes() / 10) * 10;
    const ts = now.getUTCFullYear() + '/' +
      String(now.getUTCMonth() + 1).padStart(2,'0') + '/' +
      String(now.getUTCDate()).padStart(2,'0') + '/' +
      String(now.getUTCHours()).padStart(2,'0') +
      String(min).padStart(2,'0') + '00';
    const url = 'https://himawari8.nict.go.jp/img/D531106/thumbnail/550/' + ts + '_0_0.png';
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() { earthImg = img; };
    img.onerror = function() {
      // Fallback: use dummy data URL (transparent)
      earthImg = null;
    };
    img.src = url;
  }

  window.addEventListener('resize', resize);
  resize();
  loadEarth();
  setInterval(loadEarth, 600000); // refresh every 10 min
  render();
})();
</script>
